name: Omie Unified Supabase Sync (v31.0)

on:
  schedule:
    # Rodar 2 vezes ao dia: 09:00 e 21:00 UTC (06:00 e 18:00 Horário Brasília)
    - cron: '0 9,21 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Data de início (DD/MM/AAAA) [01/06/2025]'
        required: false
        default: '01/06/2025'
      empresa:
        description: 'Empresa alvo (all, Mar Brasil, DZM, G2, Conectius)'
        required: false
        default: 'all'
      dimensions_only:
        description: 'Sincronizar apenas dimensões (categorias, projetos, fornecedores)'
        required: false
        type: boolean
        default: false

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unified Omie Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OMIE_APP_1_KEY: ${{ secrets.OMIE_APP_1_KEY }}
          OMIE_APP_1_SECRET: ${{ secrets.OMIE_APP_1_SECRET }}
          OMIE_APP_1_EMPRESA_ID: ${{ secrets.OMIE_APP_1_EMPRESA_ID }}
          OMIE_APP_1_EMPRESA_NOME: ${{ secrets.OMIE_APP_1_EMPRESA_NOME }}
          OMIE_APP_2_KEY: ${{ secrets.OMIE_APP_2_KEY }}
          OMIE_APP_2_SECRET: ${{ secrets.OMIE_APP_2_SECRET }}
          OMIE_APP_2_EMPRESA_ID: ${{ secrets.OMIE_APP_2_EMPRESA_ID }}
          OMIE_APP_2_EMPRESA_NOME: ${{ secrets.OMIE_APP_2_EMPRESA_NOME }}
          OMIE_APP_KEY_MARBRASIL: ${{ secrets.OMIE_APP_KEY_MARBRASIL }}
          OMIE_APP_SECRET_MARBRASIL: ${{ secrets.OMIE_APP_SECRET_MARBRASIL }}
          OMIE_APP_KEY_DZM: ${{ secrets.OMIE_APP_KEY_DZM }}
          OMIE_APP_SECRET_DZM: ${{ secrets.OMIE_APP_SECRET_DZM }}
          OMIE_APP_KEY_G2: ${{ secrets.OMIE_APP_KEY_G2 }}
          OMIE_APP_SECRET_G2: ${{ secrets.OMIE_APP_SECRET_G2 }}
          OMIE_APP_KEY_CONECTIUS: ${{ secrets.OMIE_APP_KEY_CONECTIUS }}
          OMIE_APP_SECRET_CONECTIUS: ${{ secrets.OMIE_APP_SECRET_CONECTIUS }}
        shell: bash
        run: |
          START_DATE="${{ github.event.inputs.start_date || '01/06/2025' }}"
          EMPRESA="${{ github.event.inputs.empresa || 'all' }}"
          DIM_FLAG=""
          if [ "${{ github.event.inputs.dimensions_only }}" = "true" ]; then
            DIM_FLAG="--dimensions-only"
          fi
          python sync_omie_unified_v4.py --start-date "$START_DATE" --empresa "$EMPRESA" $DIM_FLAG
