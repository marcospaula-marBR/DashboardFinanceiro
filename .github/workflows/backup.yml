name: Supabase Daily Backup
# Versao 1.0.4 - Armazenamento seguro de Backup em GitHub Artifacts (90 dias) e Google Drive opcional

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite rodar o backup manualmente pelo painel do GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth

    - name: Run Supabase Full Backup
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        python .github/scripts/backup_supabase.py --output-dir . --workers 6

    - name: Encrypt Backup File with GPG
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        # Localiza o arquivo .tar.gz gerado
        ARCHIVE_FILE=$(ls -t supabase_backup_*.tar.gz | head -n 1)
        echo "Arquivo original: $ARCHIVE_FILE"

        if [ -n "$GPG_PASSPHRASE" ]; then
          FINAL_NAME="${ARCHIVE_FILE}.gpg"
          echo "🔐 Criptografando backup com GPG -> $FINAL_NAME"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -c -o "$FINAL_NAME" "$ARCHIVE_FILE"
          rm -f "$ARCHIVE_FILE"
        else
          FINAL_NAME="$ARCHIVE_FILE"
          echo "ℹ️  GPG_PASSPHRASE não definida. Mantendo arquivo compactado -> $FINAL_NAME"
        fi

        ARTIFACT_NAME=$(echo "$FINAL_NAME" | sed 's/\.tar\.gz.*//')
        echo "FINAL_BACKUP_FILE=$FINAL_NAME" >> $GITHUB_ENV
        echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
        echo "✅ Arquivo final pronto para armazenamento: $FINAL_NAME ($(du -h "$FINAL_NAME" | cut -f1))"

    - name: Upload Backup to GitHub Artifacts (Download Direto)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.FINAL_BACKUP_FILE }}
        retention-days: 90
        if-no-files-found: error

    - name: Upload Backup to Google Drive (Opcional)
      continue-on-error: true
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS || secrets.GDRIVE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
      run: |
        if [ -n "$GOOGLE_DRIVE_FOLDER_ID" ] && [ -n "$GOOGLE_DRIVE_CREDENTIALS" ]; then
          echo "📤 Tentando sincronização com o Google Drive..."
          python .github/scripts/upload_to_drive.py --file "$FINAL_BACKUP_FILE" --folder-id "$GOOGLE_DRIVE_FOLDER_ID" || true
        else
          echo "ℹ️  Google Drive não configurado. Backup salvo com sucesso no GitHub Artifacts."
        fi

    - name: Clean Up Artifacts
      if: always()
      run: |
        rm -f supabase_backup_*.tar.gz*
        echo "🧹 Limpeza dos arquivos temporários concluída."
