name: Supabase Daily Backup to Google Drive
# Versao 1.0.1 - Configurado para criptografia segura GPG

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite rodar o backup manualmente pelo painel do GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install PostgreSQL Client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Run pg_dump from Supabase
      env:
        PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        # Extrai o host a partir da URL do projeto Supabase
        DB_HOST=$(echo "$SUPABASE_URL" | sed -e 's|https://||' -e 's|\.supabase\.co||').supabase.co
        
        # Executa o dump do banco de dados (ajuste o usuário 'postgres' se necessário)
        pg_dump -h "$DB_HOST" -U postgres -p 5432 -d postgres -F c -b -v -f supabase_backup.sql

    - name: Encrypt Backup File with GPG
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        # Criptografa o arquivo .sql gerando um arquivo .gpg protegido por senha
        gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -c supabase_backup.sql

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}

    - name: Upload Backup to Google Drive
      uses: google-github-actions/upload-cloud-storage@v2
      with:
        path: 'supabase_backup.sql.gpg'
        destination: 'drive://${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}'
        # Define o nome do arquivo final no Drive com a data atual
        parent: true
